name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
          npm run version:check

      - name: Build Apple silicon DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg -- --locked

      - name: Verify installer and launch application
        shell: bash
        run: |
          sw_vers
          [[ "$(sw_vers -productVersion)" == 27.* ]]
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          images=("$bundle"/dmg/*.dmg)
          [[ ${#images[@]} == 1 && -f "${images[0]}" ]]
          image="${images[0]}"
          hdiutil verify "$image"
          mount="$(mktemp -d)"
          log="$RUNNER_TEMP/paydance-macos-launch.log"
          pid=
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            hdiutil detach "$mount" -quiet || true
          }
          trap cleanup EXIT
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          app="$mount/Salary Clock for Mac.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          binary="$app/Contents/MacOS/$executable"
          lipo -verify_arch arm64 "$binary"
          "$binary" >"$log" 2>&1 &
          pid=$!
          sleep 10
          cat "$log"
          kill -0 "$pid"

          version=$(node -p 'require("./package.json").version')
          mkdir -p release-assets
          filename="Salary-Clock-$version-macos-arm64.dmg"
          cp "$image" "release-assets/$filename"
          cp LICENSE legal/ADDITIONAL_TERMS_EN.md legal/THIRD_PARTY_NOTICES_EN.md release-assets/
          printf 'Unofficial macOS adaptation based on PayDance (Copyright 2026 Mr.Baoboer).\nSource: %s/%s/tree/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > release-assets/SOURCE.txt
          (cd release-assets && shasum -a 256 "$filename" > "$filename.sha256")

      - name: Upload macOS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Salary-Clock-macos-arm64
          path: release-assets/
          if-no-files-found: error
